[project]
name = "ocr"
version = "0.1.0"
description = "Dump every text line of an English invoice or till receipt image using PaddleOCR 3.x"
readme = "README.md"
authors = [
    { name = "Hassan Jawhar" }
]
# paddlepaddle 3.3.1 publishes wheels for cp39..cp313 only; 3.14 cannot resolve.
requires-python = ">=3.12,<3.14"
dependencies = [
    "onnxruntime>=1.30.0",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]

[project.scripts]
ocr = "ocr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: exercises the real PaddleOCR models; opt in with OCR_E2E=1",
]
